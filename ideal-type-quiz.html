function restart(){showScreen('screen-welcome')}
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
async function shareResult(){const data={title:'我的心动类型是…',text:`我测出的是「${RESULTS[resultType].title}」！来发现你的心动偏好（仅供娱乐）。`,url:location.origin+location.pathname};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}try{if(!navigator.clipboard)throw Error('clipboard unavailable');await navigator.clipboard.writeText(data.text+' '+data.url);toast('结果和链接已复制，去粘贴分享吧')}catch{$('copyFallback').value=data.text+' '+data.url;$('copyFallback').hidden=false;$('copyFallback').focus();$('copyFallback').select();toast('请长按下方文字复制链接')}}
document.addEventListener('keydown',e=>{if(!$('screen-quiz').classList.contains('active')||e.repeat)return;const n=Number(e.key);if(n>=1&&n<=8){e.preventDefault();$('optionsBox').children[n-1].click()}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&!$('nextBtn').disabled){e.preventDefault();nextQuestion()}});
</script></body></html>
